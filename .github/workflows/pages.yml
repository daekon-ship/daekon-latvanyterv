name: Ellenőrzés és GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Böngészős tesztek (Playwright, Chromium)
        run: |
          pip install --quiet playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/srv && cp -r site /tmp/srv/daekon-latvanyterv
          (cd /tmp/srv && python3 -m http.server 4173 >/dev/null 2>&1 &)
          sleep 2
          set +e
          python3 tests/e2e.py http://localhost:4173/daekon-latvanyterv/ shots 2>&1 | tee e2e.log
          echo ${PIPESTATUS[0]} > e2e.code
          exit 0

      - name: Teszteredmény mentése a ci-eredmenyek ágra
        if: always()
        run: |
          mkdir -p /tmp/ci && cp e2e.log e2e.code /tmp/ci/ 2>/dev/null || true
          cp shots/eredmeny.json /tmp/ci/ 2>/dev/null || true
          mkdir -p /tmp/ci/kepek && cp shots/*.png /tmp/ci/kepek/ 2>/dev/null || true
          cd /tmp/ci
          git init -q -b ci-eredmenyek
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "E2E: ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-eredmenyek || true

      - name: Tesztek eredménye
        run: test "$(cat e2e.code)" = "0"

      - name: Publikálás a gh-pages ágra
        run: |
          cp -r site /tmp/ghp
          cd /tmp/ghp
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
